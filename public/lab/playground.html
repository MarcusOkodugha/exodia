<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Playground</title>
<style>
:root{--bg:#FAF9F5;--text:#141413;--text2:#6B6A64;--clay:#C96442;--clayText:#A54A28}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:1100px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 12px 24px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.back{color:var(--clay);font-size:15px;text-decoration:none}
.legacyBtn{display:inline-flex;align-items:center;height:36px;padding:0 14px;border-radius:10px;background:#EFECE4;color:var(--text);font-size:14px;font-weight:600;text-decoration:none}
.credit{font-size:11.5px;color:var(--text2);margin:16px 0 0;line-height:16px;text-align:center}
/* Exodia hit animations: a row of plays and one stage that covers the screen. */
.hits{margin:34px 0 18px}.hits h2{margin:0 0 6px;font-size:19px;line-height:24px;font-weight:600}.hits p{margin:0 0 8px;font-size:14px;line-height:20px;color:var(--text2)}
.hitRow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:700px){.hitRow{grid-template-columns:repeat(5,minmax(0,1fr))}}
.hitRow button{display:block;width:100%;padding:12px 12px;border:0;border-radius:14px;background:#F0EEE6;color:var(--text);font:inherit;font-size:15px;font-weight:600;text-align:left;cursor:pointer}
.hitRow button small{display:block;margin-top:2px;font-weight:400;font-size:12.5px;color:var(--text2)}
#hitStage{position:fixed;inset:0;z-index:50;display:none;background:var(--bg);overflow:hidden;cursor:pointer}
#hitStage.on{display:block}
#hitStage .hitCanvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hitStage .hitFrame{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
#hitStage .hitWord{position:absolute;left:0;right:0;top:calc(50% + min(31vh,62vw));text-align:center;font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;font-size:30px;color:var(--text);letter-spacing:0.01em}
#hitStage .hitTag{position:absolute;left:0;top:0;opacity:0;font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;pointer-events:none;will-change:transform,opacity}
#hitStage .hitHalo{position:absolute;left:50%;top:50%;width:min(56vh,86vw);aspect-ratio:1;border-radius:50%;border:1.5px solid #7CA3DD;opacity:0;pointer-events:none}
#hitStage .hitShade{position:absolute;left:50%;top:calc(50% + min(25vh,48vw));width:min(30vh,46vw);height:min(3vh,5vw);border-radius:50%;background:radial-gradient(closest-side,rgb(20 20 19 / 0.16),rgb(20 20 19 / 0));pointer-events:none}
#hitStage .hitArcs{position:absolute;left:50%;top:50%;width:min(62vh,92vw);aspect-ratio:1;transform:translate(-50%,-50%)}
#hitStage .hitArcs svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#hitStage .hitArcs .ring{transform-origin:150px 150px}
#hitStage .hitArcs text{font-size:11.5px;font-weight:600;fill:var(--text2)}
#hitStage .hitArcs .hand{position:absolute;left:17%;top:17%;width:66%;height:66%;opacity:0}
#hitStage .hitArcs .hand.blue{opacity:1}
#hitClose{position:fixed;top:calc(env(safe-area-inset-top) + 6px);right:6px;z-index:51;width:48px;height:48px;border:0;background:none;color:var(--text2);display:none}
#hitStage.on + #hitClose{display:block}

/* Aura build: now vs smoother (lab/aura-build.js) */
.ab{margin:22px 0 0}
.abBy{margin:0 0 2px;font-size:12.5px;font-weight:600;color:var(--clayText)}
.ab h2{margin:0 0 6px;font-size:19px;line-height:24px;font-weight:600}
.abLead{margin:0 0 6px;max-width:680px;font-size:14px;line-height:20px;color:var(--text2)}
.abLead.abSign{color:var(--text);font-weight:600}
.abPair{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;margin-top:12px}
@media (min-width:760px){.abPair{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}}
.abHead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.abTitle{margin:0;font-size:15px;font-weight:600}
.abReplay{height:36px;padding:0 14px;border:0;border-radius:10px;background:#EFECE4;color:var(--text);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.abReplay:active{transform:scale(.97)}
.abSquad{height:260px;margin-top:6px;touch-action:pan-y}
@media (min-width:760px){.abSquad{height:360px}}
.abNames{display:grid;grid-template-columns:1fr 1fr 1fr;margin:2px 0 0;text-align:center;font-size:13px;color:var(--text2)}
.abLine{margin:8px 0 0;font-size:13px;line-height:18px;color:var(--text2)}
.abAll{margin:14px 0 0}
.abNote{margin:10px 0 0;max-width:680px;font-size:13px;line-height:18px;color:var(--text2)}
/* ===== 3D body: the app's own rules for body3d.js (copied from styles.css, which this page does not load) ===== */
.body3dHost{position:relative}
.body3dCanvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;cursor:grab}
.body3dOver{position:fixed;inset:0;z-index:80;display:none;touch-action:none;user-select:none;-webkit-user-select:none}
.body3dOver.on{display:block;background:var(--bg)}
.body3dOver .body3dCanvas{touch-action:none}
.body3dClose{position:absolute;top:calc(env(safe-area-inset-top) + 6px);right:6px;width:48px;height:48px;padding:0;border:0;background:none;color:var(--text2);opacity:0;transition:opacity .3s ease;cursor:pointer}
.body3dClose svg{display:block;margin:auto}
.body3dWho{position:absolute;top:calc(env(safe-area-inset-top) + 20px);left:16px;max-width:calc(100% - 80px);padding:0;border:0;background:none;font-family:inherit;text-align:left;font-size:15px;line-height:20px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .3s ease;pointer-events:none}
.body3dOver.in .body3dClose,.body3dOver.in .body3dWho{opacity:1}
.body3dName{position:absolute;left:16px;top:calc(env(safe-area-inset-top) + 44px);max-width:calc(100% - 80px);display:flex;align-items:center;gap:7px;font-size:14px;line-height:20px;font-weight:600;color:var(--text);white-space:nowrap;opacity:0;transition:opacity .28s ease;pointer-events:none}
.body3dOver.in .body3dName.on{opacity:1}
.body3dName span{overflow:hidden;text-overflow:ellipsis}
.body3dName i{flex:none;width:10px;height:10px;border-radius:3px}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><main>
<div class="top"><a class="back" href="/">Back to Exodia</a><a class="legacyBtn" href="/lab/looks.html">Legacy anatomies</a></div>
<section class="ab" id="auraBuild"></section>
<section class="hits"><h2>Exodia hit</h2><p>Still to decide: which hit animation plays. Tap one to play it.</p><div class="hitRow" id="hitRow"></div></section>
<p class="credit">Model: Z-Anatomy (Gauthier Kervyn), BodyParts3D (DBCLS), CC BY-SA 4.0.</p>
</main>
<div id="hitStage" aria-hidden="true"></div><button id="hitClose" aria-label="Close"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 3l12 12M15 3L3 15"/></svg></button>
<script type="module">
// Exodia hit animations: tap one to play it over the whole screen, tap again (or the cross) to close.
import { HITS, play } from '/lab/hits.js';
const row = document.getElementById('hitRow'), stage = document.getElementById('hitStage'); let stop = null, turn = 0;
const close = () => { turn++; if (stop) stop(); stop = null; stage.replaceChildren(); stage.classList.remove('on'); };
row.innerHTML = HITS.map(([key, name, note]) => `<button data-hit="${key}">${name}<small>${note}</small></button>`).join('');
row.addEventListener('click', async (e) => { const b = e.target.closest('[data-hit]'); if (!b) return; close(); const mine = ++turn; stage.classList.add('on');
  try { const s = await play(b.dataset.hit, stage); if (mine === turn) stop = s; else s(); } catch (err) { if (mine === turn) { stage.textContent = 'Could not play: ' + err.message; } } });
stage.addEventListener('click', close); document.getElementById('hitClose').addEventListener('click', close);
addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
window.__playHit = (k) => row.querySelector(`[data-hit="${k}"]`).click();
// /lab/playground.html?play=fist3d starts that one straight away (the Dev menu's links).
{ const want = new URLSearchParams(location.search).get('play'); if (want && row.querySelector(`[data-hit="${want}"]`)) window.__playHit(want); }
</script>
<script type="module" src="/lab/aura-build.js"></script>
</body></html>
