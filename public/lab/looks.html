<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Anatomy looks</title>
<style>
:root{--bg:#FAF9F5;--text:#141413;--text2:#6B6A64;--clay:#C96442}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:1100px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 12px 24px}
.back{color:var(--clay);font-size:15px;text-decoration:none}
.grid{display:flex;justify-content:center;gap:4px;margin-top:4px}
.col{flex:1 1 0;max-width:calc((100svh - 150px) / 2.5);min-width:0}
.cell{aspect-ratio:1/2.5;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:pointer}
.tag{text-align:center;font-size:15px;font-weight:600;margin-top:2px}

.credit{font-size:11.5px;color:var(--text2);margin:16px 0 0;line-height:16px;text-align:center}
#c{position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none;z-index:5;display:block}
#over{position:fixed;inset:0;z-index:6;touch-action:none;user-select:none;-webkit-user-select:none;display:none}
#over.on{display:block}
#close{position:absolute;top:calc(env(safe-area-inset-top) + 6px);right:6px;width:48px;height:48px;border:0;background:none;padding:0;color:var(--text2);opacity:0;transition:opacity .3s ease;cursor:pointer}
#over.in #close{opacity:1}
#close svg{display:block;margin:auto}
#name{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 22px);text-align:center;font-size:15px;font-weight:600;opacity:0;transform:translateY(4px);transition:opacity .28s ease,transform .28s ease;pointer-events:none}

<script type="module">
import * as THREE from 'three';

const gltf = await new GLTFLoader().loadAsync('./anatomy.glb');

  geo.setAttribute('color', new THREE.BufferAttribute(col, 3)); geo.setAttribute('aAxis', new THREE.BufferAttribute(axis, 3));

  s.vertexShader = 'attribute float aGroup; uniform vec3 uPal[16]; uniform vec4 uSel; uniform vec3 uClay; uniform vec3 uPlain; varying vec3 vTint;\n' + s.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>\n${SEL}

const hullMat = new THREE.ShaderMaterial({ side: THREE.BackSide, polygonOffset: true, polygonOffsetFactor: 0.5, polygonOffsetUnits: 1, uniforms: { uPx: { value: new THREE.Vector2() }, uInk: { value: new THREE.Color('#4F4A45') }, uGap: { value: new THREE.Color('#B4AFA6') } },
  vertexShader: `uniform vec2 uPx; varying float vZ; void main(){ vec4 c = projectionMatrix * modelViewMatrix * vec4(position, 1.0); vec3 nv = normalize(normalMatrix * normal); vZ = nv.z; c.xy += nv.xy * uPx * c.w; gl_Position = c; }`,
  // Ink at the rim; where you look straight into a gap between muscles it is soft shade, not a black blot.
  fragmentShader: `uniform vec3 uInk; uniform vec3 uGap; varying float vZ; void main(){ gl_FragColor = vec4(mix(uInk, uGap, smoothstep(0.4, 0.9, -vZ)), 1.0);\n#include <colorspace_fragment>\n}` });

const LOOKS = [{ name: 'D', book: false }, { name: 'E', book: true }];
const views = LOOKS.map((look, i) => {
  const scene = new THREE.Scene(); const pivot = new THREE.Group(); const f = new THREE.Group(); f.position.copy(center).negate(); pivot.add(f); scene.add(pivot);
  const muscle = new THREE.Mesh(muscleGeo, look.book ? matE : matD), ctx = new THREE.Mesh(ctxGeo, look.book ? ctxE : ctxD); f.add(muscle, ctx);
  if (look.book) f.add(new THREE.Mesh(muscleGeo, hullMat), new THREE.Mesh(ctxGeo, hullMat));
  else { scene.add(new THREE.HemisphereLight(0xffffff, 0xd8d2c4, 2.2)); const dir = new THREE.DirectionalLight(0xffffff, 1.1); dir.position.set(2, 3, 4); scene.add(dir); }
  return { scene, pivot, muscle, ctx, look, cell: cells[i], t: 0, rect: null };
});

// The see-through sheet that covers the page while a figure is open.
const veil = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.MeshBasicMaterial({ color: BG, transparent: true, depthTest: false, depthWrite: false }));
const veilScene = new THREE.Scene(); veilScene.add(veil); const veilCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const FOV = 30, TAN = Math.tan(FOV * Math.PI / 360);
const cam = new THREE.PerspectiveCamera(FOV, 1, 0.01, 100);
const ease = (t) => t * t * t * (t * (t * 6 - 15) + 10);
let angle = 0.5, speed = 0.05, lastT = performance.now(), drag = null, open = -1, hold = false;
let selGroup = 0; const sel = U.uSel.value;

const frame = (v) => { // where on screen the figure sits right now, between its cell and the whole screen
  const r = v.cell.getBoundingClientRect(), e = ease(v.t);
  return { x: r.left * (1 - e), y: r.top * (1 - e), w: r.width + (W - r.width) * e, h: r.height + (H - r.height) * e, e };
};
const aim = (r) => { // camera that fits the whole figure in that rectangle
  const a = r.w / r.h, margin = 1.04 + 0.14 * r.e, d = Math.max(height * 0.5 * margin / TAN, height * 0.203 * margin / (TAN * a));
  cam.aspect = a; cam.position.set(0, -height * 0.012 * r.e, d); cam.lookAt(0, -height * 0.012 * r.e, 0); cam.updateProjectionMatrix(); cam.updateMatrixWorld(); return d;
};
const show = (v) => {
  const r = v.rect, d = aim(r); v.pivot.rotation.y = angle;
  if (v.look.book) { const px = Math.max(0.8, Math.min(1.5, r.h * 0.0021));
    hullMat.uniforms.uPx.value.set(2 * px / r.w, 2 * px / r.h);
    // Fibre spacing is fixed on the body (about 2.3 px in the cell), so opening the figure zooms into the drawing.
    const cr = v.cell.getBoundingClientRect(), d0 = Math.max(height * 0.52 / TAN, height * 0.211 / (TAN * cr.width / cr.height));
    matE.uniforms.uFreq.value = cr.height / (2 * d0 * TAN) / Math.max(2.3, 3.4 / DPR);
    matE.uniforms.uHatch.value = ctxE.uniforms.uHatch.value = 1 / (DPR * 2.9 * 1.414); }
  const y = H - r.y - r.h; renderer.setViewport(r.x, y, r.w, r.h); renderer.setScissor(r.x, y, r.w, r.h); renderer.render(v.scene, cam);
};
const draw = () => {
  const now = performance.now(), ms = Math.min(50, now - lastT), dt = ms / 16.7; lastT = now;
  if (!drag && !hold) { const idle = selGroup ? 0 : 0.006 * Math.sign(speed || 1); speed += (idle - speed) * 0.04 * dt; angle += speed * dt; }
  for (const v of views) { const to = open === views.indexOf(v) ? 1 : 0; v.t = Math.max(0, Math.min(1, v.t + Math.sign(to - v.t) * ms / 480)); v.rect = frame(v); }
  sel.y += ((selGroup === sel.x ? 1 : 0) - sel.y) * Math.min(1, 0.2 * dt); sel.w += (0 - sel.w) * Math.min(1, 0.2 * dt);
  renderer.setViewport(0, 0, W, H); renderer.setScissor(0, 0, W, H); renderer.setClearColor(0x000000, 0); renderer.clear();
  const top = views.filter((v) => v.t > 0).sort((a, b) => a.t - b.t).pop();
  for (const v of views) if (v !== top) show(v);
  if (top) { renderer.setViewport(0, 0, W, H); renderer.setScissor(0, 0, W, H); veil.material.opacity = Math.min(1, top.rect.e * 1.6); renderer.render(veilScene, veilCam); renderer.clearDepth(); show(top); }
  else if (over.classList.contains('on') && open < 0) over.classList.remove('on');
  requestAnimationFrame(draw);
};

// Selecting a muscle.
const select = (g) => { if (g === selGroup) return; if (sel.y > 0.01) { sel.z = sel.x; sel.w = sel.y; } sel.y = 0; if (g) sel.x = g; selGroup = g;
  if (g) { nameEl.textContent = NAMES[GROUPS[g - 1]]; nameEl.classList.add('on'); } else nameEl.classList.remove('on'); };
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const pick = (x, y) => { const v = views[open], r = v.rect; aim(r); v.pivot.rotation.y = angle; v.scene.updateMatrixWorld(true);
  ndc.set((x - r.x) / r.w * 2 - 1, -((y - r.y) / r.h * 2 - 1)); ray.setFromCamera(ndc, cam);
  const hit = ray.intersectObjects([v.muscle, v.ctx], false)[0];
  return hit ? { group: hit.object === v.muscle ? muscleGeo.userData.grp[hit.face.a] : 0 } : null; };
const expand = (i) => { open = i; over.classList.add('on'); requestAnimationFrame(() => over.classList.add('in')); };
const collapse = () => { select(0); open = -1; over.classList.remove('in'); };

// Drag to spin (with a little throw), tap to open or select. A tap is a touch that moved less than 6 px.
const spin = (el, onTap) => {
  el.addEventListener('pointerdown', (e) => { if (e.target.closest('#close')) return; drag = { id: e.pointerId, x: e.clientX, y: e.clientY, a: angle, last: e.clientX, lt: e.timeStamp, far: 0 }; speed = 0; try { el.setPointerCapture(e.pointerId); } catch {} });
  el.addEventListener('pointermove', (e) => { if (!drag || drag.id !== e.pointerId) return; drag.far = Math.max(drag.far, Math.hypot(e.clientX - drag.x, e.clientY - drag.y));
    if (drag.far < 6) return; const k = 0.012 * Math.min(1, 393 / Math.max(393, W * 0.6));
    angle = drag.a + (e.clientX - drag.x) * k; speed = Math.max(-0.3, Math.min(0.3, (e.clientX - drag.last) * k / Math.max(1, e.timeStamp - drag.lt) * 16.7)); drag.last = e.clientX; drag.lt = e.timeStamp; });
  el.addEventListener('pointerup', (e) => { if (!drag || drag.id !== e.pointerId) return; const d = drag; drag = null; if (d.far < 6) { speed = 0.0001 * Math.sign(d.a - angle || 1); onTap(e); } else if (e.timeStamp - d.lt > 80) speed = 0; });
  el.addEventListener('pointercancel', () => { drag = null; });
};
cells.forEach((el, i) => spin(el, () => { if (open < 0) expand(i); }));
spin(over, (e) => { if (open < 0 || views[open].t < 0.5) return; const hit = pick(e.clientX, e.clientY);
  if (hit && hit.group) select(hit.group === selGroup ? 0 : hit.group); else if (selGroup) select(0); else collapse(); });
document.getElementById('close').addEventListener('click', collapse);
addEventListener('keydown', (e) => { if (e.key === 'Escape' && open >= 0) collapse(); });

window.__look = (a) => { angle = a; speed = 0; hold = true; };
draw();
</script></body></html>
