    // gets a point its fibres run towards: find the long axis, compare how wide the muscle is at its two ends, and
    // put the point beyond the narrow end where the two widths would meet. Equal ends put it far away, which

      if (ids.length < 4) { for (const i of ids) { axis.set([0, 1, 0], i * 3); apex.set([0, -100, 0, 100], i * 4); } continue; }

const V_PARS = `

const solidMat = (o) => { const m = new THREE.MeshLambertMaterial(); const fib = Boolean(o);

  m.onBeforeCompile = (s) => { Object.assign(s.uniforms, U, { uFreq: UFREQ });
    if (fib) Object.assign(s.uniforms, { uP: { value: new THREE.Vector4(o.groove, o.bump, o.crease, o.sheen) }, uQ: { value: new THREE.Vector4(o.bulk, o.warm, o.tendon, 0) } });
    s.vertexShader = V_PARS + '\nuniform vec4 uQ;\n' + s.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>\n${V_BODY}
      #ifdef FIBRE
        transformed += normal * uQ.x * (1.0 - 0.85 * smoothstep(0.5, 1.0, aEnd)) * step(0.5, aGroup);
      #endif`);
    s.fragmentShader = F_PARS + '\nuniform vec4 uP; uniform vec4 uQ; uniform vec3 uPlain;\n' + s.fragmentShader
      .replace('#include <color_fragment>', `diffuseColor.rgb = vCol;
        #ifdef FIBRE
          float tend = smoothstep(0.6, 0.98, vShade.y); float fAmt = 1.0 - 0.85 * tend; float fG = fibre(normalize(vON), 0.1).x;
          diffuseColor.rgb = mix(diffuseColor.rgb, uPlain * 1.04, tend * uQ.z);
          diffuseColor.rgb *= 1.0 - uP.x * fG * fAmt;
        #endif`)
      .replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
        #ifdef FIBRE
          { float hgt = -fG * fAmt * uP.y * 0.0007; vec2 dH = vec2(dFdx(hgt), dFdy(hgt));
            vec3 sx = dFdx(-vViewPosition), sy = dFdy(-vViewPosition); vec3 r1 = cross(sy, normal), r2 = cross(normal, sx); float det = dot(sx, r1);
            normal = normalize(abs(det) * normal - sign(det) * (dH.x * r1 + dH.y * r2)); }
        #endif`)
      .replace('#include <opaque_fragment>', `
        #ifdef FIBRE
          outgoingLight *= mix(vec3(1.0), mix(vec3(0.5), vec3(0.66, 0.42, 0.37), uQ.y), clamp((1.0 - vShade.x) * 1.5, 0.0, 1.0) * uP.z);
          vec3 hv = normalize(normalize(vec3(2.0, 3.0, 4.0)) + normalize(vViewPosition));
          outgoingLight += vec3(1.0, 0.97, 0.93) * pow(max(dot(normal, hv), 0.0), 26.0) * uP.w;
        #endif
        #include <opaque_fragment>`); };
  m.customProgramCacheKey = () => 'solid' + fib; return m; };
const ctxMat = () => new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide });

// H: the anatomy-book plate. Nothing is filled in: every muscle is only fine ink lines along its fibres, thicker
// in the shade, plus a contour, so you look through the body. The nearest surface is drawn at full strength; the
// surfaces behind it show through between the lines, fainter the further back they are. Muscles with a level
// take its colour as line colour and a light wash.
const lineMat = (fibre, ghost) => new THREE.ShaderMaterial({ transparent: true, depthWrite: false, depthTest: !ghost,
  uniforms: { ...U, uFreq: UFREQ_H, uFibre: { value: fibre }, uGhost: { value: ghost }, uDepth: { value: new THREE.Vector2(6, 0.2) }, uInk: { value: new THREE.Color('#3A3633') } },
  vertexShader: `${V_PARS} varying vec3 vN; varying float vZ;
    void main(){ ${V_BODY}
      vN = normalize(normalMatrix * normal); vec4 mv = modelViewMatrix * vec4(position, 1.0); vZ = -mv.z; gl_Position = projectionMatrix * mv; }`,
  fragmentShader: `${F_PARS} uniform float uFibre; uniform float uGhost; uniform vec2 uDepth; uniform vec3 uInk; varying vec3 vN; varying float vZ;
    void main(){
      vec3 n = normalize(vN) * (gl_FrontFacing ? 1.0 : -1.0);
      float lit = dot(n, normalize(vec3(-0.42, 0.55, 0.72))) * 0.5 + 0.5;
      float dark = 1.0 - clamp(lit * mix(1.0, vShade.x, 0.85) * 1.12 - pow(1.0 - clamp(n.z, 0.0, 1.0), 2.6) * 0.3, 0.0, 1.0);
      float tend = smoothstep(0.62, 0.98, vShade.y) * uFibre; float tint = vTint.a * (1.0 - 0.6 * tend);
      vec3 ink = mix(uInk, vTint.rgb * mix(0.62, 0.8, vShade.z), tint);
      float l = 0.0;
      if (uFibre > 0.0) { float wid = (0.045 + 0.13 * smoothstep(0.15, 0.95, dark)) * (0.6 + 0.8 * n3(vP * vec3(90.0, 26.0, 90.0)));
        l = fibre(normalize(vON), wid).y * (1.0 - 0.75 * tend); }
      vec3 col; float a;
      if (uGhost > 0.0) {
        float edge = 1.0 - smoothstep(0.6, 1.6, n.z / (fwidth(n.z) + 1e-4));
        float far = clamp((vZ - uDepth.x + uDepth.y) / (2.0 * uDepth.y), 0.0, 1.0);
        col = ink; a = (l * 0.6 + edge * 0.8 * (1.0 - l * 0.6)) * mix(0.17, 0.035, far);
      } else {
        float wash = tint * (0.2 + 0.2 * dark + 0.3 * vShade.z) + (1.0 - uFibre) * 0.1 * smoothstep(0.25, 0.9, dark);
        float la = l * (0.42 + 0.22 * tint + 0.3 * dark);
        a = la + wash * (1.0 - la); col = mix(mix(uInk, vTint.rgb, min(1.0, tint * 3.0 + uFibre)), ink, la / max(a, 1e-4));
      }
      gl_FragColor = vec4(col, a);
      #include <colorspace_fragment>
    }` });
// Ink contour: the same shape again, back faces only, pushed out a fixed number of screen pixels.
const hullMat = new THREE.ShaderMaterial({ side: THREE.BackSide, transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: 0.5, polygonOffsetUnits: 1, uniforms: { uPx: { value: new THREE.Vector2() }, uInk: { value: new THREE.Color('#4F4A45') } },
  vertexShader: `uniform vec2 uPx; varying float vZ; void main(){ vec4 c = projectionMatrix * modelViewMatrix * vec4(position, 1.0); vec3 nv = normalize(normalMatrix * normal); vZ = nv.z; c.xy += nv.xy * uPx * c.w; gl_Position = c; }`,
  // Ink at the rim; where you look straight into a gap between muscles it is a faint shade, not a blot.
  fragmentShader: `uniform vec3 uInk; varying float vZ; void main(){ gl_FragColor = vec4(uInk, mix(1.0, 0.14, smoothstep(0.35, 0.85, -vZ)));\n#include <colorspace_fragment>\n}` });
const depthMat = new THREE.MeshBasicMaterial({ colorWrite: false }), depthMat2 = new THREE.MeshBasicMaterial({ colorWrite: false, side: THREE.DoubleSide });

// D2 is D cut clean through the neck, just under the chin, so the body can fill its frame.
const NECK = 0.664;
const LOOKS = [
  { name: 'D2', cut: NECK },
  { name: 'D2', cut: NECK },
  { name: 'D' },
  { name: 'F', solid: { bulk: 0.0125, groove: 0.2, bump: 1, crease: 0.6, sheen: 0.05, warm: 0.35, tendon: 0.45 } },
  { name: 'G', solid: { bulk: 0.0035, groove: 0.05, bump: 0.55, crease: 0.8, sheen: 0.13, warm: 0.75, tendon: 0.2 } },
  { name: 'H', lines: true },
];
const views = LOOKS.map((look, i) => {
  const scene = new THREE.Scene(); const pivot = new THREE.Group(); const f = new THREE.Group(); f.position.copy(center).negate(); pivot.add(f); scene.add(pivot);
  const mesh = (geo, mat, order = 0) => { const x = new THREE.Mesh(geo, mat); x.renderOrder = order; f.add(x); return x; };
  let muscle, ctx;
  if (look.lines) { // depth of the nearest surface first, then the faint layers behind, the contours, the near surface
    mesh(muscleGeo, depthMat, -1); mesh(ctxGeo, depthMat2, -1);
    look.ghost = [mesh(muscleGeo, lineMat(1, 1), 1), mesh(ctxGeo, lineMat(0, 1), 1)];
    mesh(muscleGeo, hullMat, 2); mesh(ctxGeo, hullMat, 2);
    muscle = mesh(muscleGeo, lineMat(1, 0), 3); ctx = mesh(ctxGeo, lineMat(0, 0), 3); ctx.material.side = THREE.DoubleSide;
  } else { muscle = mesh(muscleGeo, solidMat(look.solid)); ctx = mesh(ctxGeo, ctxMat());
    if (look.cut) muscle.material.clippingPlanes = ctx.material.clippingPlanes = [new THREE.Plane(new THREE.Vector3(0, -1, 0), look.cut - center.y)];
    scene.add(new THREE.HemisphereLight(0xffffff, 0xd8d2c4, 2.2)); const dir = new THREE.DirectionalLight(0xffffff, 1.1); dir.position.set(2, 3, 4); scene.add(dir); }
  return { scene, pivot, muscle, ctx, look, cell: cells[i], t: 0, rect: null };
});

// The see-through sheet that covers the page while a figure is open.
const veil = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.MeshBasicMaterial({ color: BG, transparent: true, depthTest: false, depthWrite: false }));
const veilScene = new THREE.Scene(); veilScene.add(veil); const veilCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const FOV = 30, TAN = Math.tan(FOV * Math.PI / 360);
const cam = new THREE.PerspectiveCamera(FOV, 1, 0.01, 100);
const ease = (t) => t * t * t * (t * (t * 6 - 15) + 10);
let angle = 0.5, speed = 0.05, lastT = performance.now(), drag = null, open = -1, hold = false;
let selGroup = 0; const sel = U.uSel.value;

const frame = (v) => { // where on screen the figure sits right now, between its cell and the whole screen
  const r = v.cell.getBoundingClientRect(), e = ease(v.t);
  return { x: r.left * (1 - e), y: r.top * (1 - e), w: r.width + (W - r.width) * e, h: r.height + (H - r.height) * e, e };
};
const aim = (r, v) => { // camera that fits the figure (whole, or neck to feet) in that rectangle
  const top = v.look.cut || box.max.y, hh = (top - box.min.y) / 2, cy = (top + box.min.y) / 2 - center.y - height * 0.012 * r.e;
  const a = r.w / r.h, margin = (v.look.cut ? 1.025 : 1.04) + 0.14 * r.e, d = Math.max(hh * margin / TAN, height * 0.203 * margin / (TAN * a));
  cam.aspect = a; cam.position.set(0, cy, d); cam.lookAt(0, cy, 0); cam.updateProjectionMatrix(); cam.updateMatrixWorld(); return d;
};
const show = (v) => {
  const r = v.rect; if (v.t === 0 && (r.y > H || r.y + r.h < 0)) return;
  const d = aim(r, v); v.pivot.rotation.y = angle;
  if (v.look.lines) { const px = Math.max(0.8, Math.min(1.5, r.h * 0.0021)); hullMat.uniforms.uPx.value.set(2 * px / r.w, 2 * px / r.h);
    for (const g of v.look.ghost) g.material.uniforms.uDepth.value.set(d, height * 0.11); }
  const y = H - r.y - r.h; renderer.setViewport(r.x, y, r.w, r.h); renderer.setScissor(r.x, y, r.w, r.h); renderer.render(v.scene, cam);
};
const draw = () => {
  const now = performance.now(), ms = Math.min(50, now - lastT), dt = ms / 16.7; lastT = now;
  if (!drag && !hold) { const idle = selGroup ? 0 : 0.006 * Math.sign(speed || 1); speed += (idle - speed) * 0.04 * dt; angle += speed * dt; }
  for (const v of views) { const to = open === views.indexOf(v) ? 1 : 0; v.t = Math.max(0, Math.min(1, v.t + Math.sign(to - v.t) * ms / 480)); v.rect = frame(v); }
  sel.y += ((selGroup === sel.x ? 1 : 0) - sel.y) * Math.min(1, 0.2 * dt); sel.w += (0 - sel.w) * Math.min(1, 0.2 * dt);
  // Fibre spacing is fixed on the body (about 2.4 px in a small cell), so opening a figure zooms into it.
  const cr = cells[2].getBoundingClientRect(), d0 = Math.max(height * 0.52 / TAN, height * 0.211 / (TAN * cr.width / cr.height));
  UFREQ.value = cr.height / (2 * d0 * TAN) / Math.max(2.4, 3.4 / DPR); UFREQ_H.value = UFREQ.value * 0.78;
  renderer.setViewport(0, 0, W, H); renderer.setScissor(0, 0, W, H); renderer.setClearColor(0x000000, 0); renderer.clear();
  const top = views.filter((v) => v.t > 0).sort((a, b) => a.t - b.t).pop();
  for (const v of views) if (v !== top) show(v);
  if (top) { renderer.setViewport(0, 0, W, H); renderer.setScissor(0, 0, W, H); veil.material.opacity = Math.min(1, top.rect.e * 1.6); renderer.render(veilScene, veilCam); renderer.clearDepth(); show(top); }
  else if (over.classList.contains('on') && open < 0) over.classList.remove('on');
  requestAnimationFrame(draw);
};

// Selecting a muscle.
const select = (g) => { if (g === selGroup) return; if (sel.y > 0.01) { sel.z = sel.x; sel.w = sel.y; } sel.y = 0; if (g) sel.x = g; selGroup = g;
  if (g) { nameEl.textContent = NAMES[GROUPS[g - 1]]; nameEl.classList.add('on'); } else nameEl.classList.remove('on'); };
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const pick = (x, y) => { const v = views[open], r = v.rect; aim(r, v); v.pivot.rotation.y = angle; v.scene.updateMatrixWorld(true);
  ndc.set((x - r.x) / r.w * 2 - 1, -((y - r.y) / r.h * 2 - 1)); ray.setFromCamera(ndc, cam);
  const hit = ray.intersectObjects([v.muscle, v.ctx], false).find((h) => !v.look.cut || h.point.y < v.look.cut - center.y);
  return hit ? { group: hit.object === v.muscle ? muscleGeo.userData.grp[hit.face.a] : 0 } : null; };
const expand = (i) => { open = i; over.classList.add('on'); requestAnimationFrame(() => over.classList.add('in')); };
const collapse = () => { select(0); open = -1; over.classList.remove('in'); };

// Drag to spin (with a little throw), tap to open or select. A tap is a touch that moved less than 6 px.
const spin = (el, onTap) => {
  el.addEventListener('pointerdown', (e) => { if (e.target.closest('#close')) return; drag = { id: e.pointerId, x: e.clientX, y: e.clientY, a: angle, last: e.clientX, lt: e.timeStamp, far: 0 }; speed = 0; try { el.setPointerCapture(e.pointerId); } catch {} });
  el.addEventListener('pointermove', (e) => { if (!drag || drag.id !== e.pointerId) return; drag.far = Math.max(drag.far, Math.hypot(e.clientX - drag.x, e.clientY - drag.y));
    if (drag.far < 6) return; const k = 0.012 * Math.min(1, 393 / Math.max(393, W * 0.6));
    angle = drag.a + (e.clientX - drag.x) * k; speed = Math.max(-0.3, Math.min(0.3, (e.clientX - drag.last) * k / Math.max(1, e.timeStamp - drag.lt) * 16.7)); drag.last = e.clientX; drag.lt = e.timeStamp; });
  el.addEventListener('pointerup', (e) => { if (!drag || drag.id !== e.pointerId) return; const d = drag; drag = null; if (d.far < 6) { speed = 0.0001 * Math.sign(d.a - angle || 1); onTap(e); } else if (e.timeStamp - d.lt > 80) speed = 0; });
  el.addEventListener('pointercancel', () => { drag = null; });
};
cells.forEach((el, i) => spin(el, () => { if (open < 0) expand(i); }));
spin(over, (e) => { if (open < 0 || views[open].t < 0.5) return; const hit = pick(e.clientX, e.clientY);
  if (hit && hit.group) select(hit.group === selGroup ? 0 : hit.group); else if (selGroup) select(0); else collapse(); });
document.getElementById('close').addEventListener('click', collapse);
addEventListener('keydown', (e) => { if (e.key === 'Escape' && open >= 0) collapse(); });

window.__look = (a) => { angle = a; speed = 0; hold = true; };
draw();
</script></body></html>
